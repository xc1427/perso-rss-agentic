name: Update RSS Feeds

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-feeds-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact-uploaded: ${{ steps.pages-upload.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @rss-agentic/core exec playwright install --with-deps chromium

      - run: pnpm -r test

      - run: pnpm --filter @rss-agentic/personal start
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.DEEPSEEK_ANTHROPIC_COMPAT_BASE_URL }}

      - name: Upload agent transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit generated scrapers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/personal/src/generated/
          git diff --staged --quiet || (git commit -m "chore: update generated scrapers [skip ci]" && git push origin "HEAD:${GITHUB_REF_NAME}")

      - id: pages-upload
        uses: actions/upload-pages-artifact@v3
        if: always() && hashFiles('apps/personal/public/*.xml') != '' && github.ref_name == 'main'
        with:
          path: apps/personal/public/

  deploy:
    needs: build
    if: needs.build.outputs.artifact-uploaded == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
